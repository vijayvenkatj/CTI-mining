services:
  
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - platform

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
      POSTGRES_DB: ctiminer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./migrations/0002_ingestion_state.up.sql:/docker-entrypoint-initdb.d/0002_ingestion_state.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d ctiminer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform

  ingestion:
    build: .
    container_name: ingestion
    command: ["./ingestion"]
    volumes:
      - ./config.docker.json:/app/config.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - platform
    restart: unless-stopped

  edge-generation:
    build: .
    container_name: edge-generation
    command: ["./edge-generation"]
    volumes:
      - ./config.docker.json:/app/config.json:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform
    restart: unless-stopped

  estimator:
    build: .
    container_name: estimator
    command: ["./estimator"]
    volumes:
      - ./config.docker.json:/app/config.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - platform
    restart: unless-stopped

  server:
    build: .
    container_name: server
    command: ["./server"]
    volumes:
      - ./config.docker.json:/app/config.json:ro
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform
    restart: unless-stopped

networks:
  platform:

volumes:
  postgres_data:
